name: Terraform policy

# Evaluates the Rego policies from devsecops-pipeline against a real `terraform plan`.
#
# This is what turns that repository from a set of files into a merge gate. Until something
# runs the policies, they are documentation with a test suite.
#
# WHY THIS RUNS AGAINST A PLAN AND NOT AGAINST HCL
#
# A linter reading source sees `encrypted = var.encrypt_volumes` and cannot tell you what it
# evaluates to — it either guesses or stays silent, and a security control that stays silent
# is worse than none because it creates confidence it has not earned.
#
# `terraform show -json` has already resolved every variable, local, for_each and module
# boundary. The policy therefore checks the resource that is about to be created.
#
# The cost is that producing a plan needs credentials, so this cannot run on a fork's pull
# request. That gap is covered by the static scanners in security-scan.yml, which can.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      working_directory:
        type: string
        required: true
      aws_region:
        type: string
        required: false
        default: "us-east-1"
      role_arn:
        description: "Read-only plan role. The same one terraform-plan.yml uses."
        type: string
        required: true
      policy_ref:
        description: >-
          Tag of devsecops-pipeline to evaluate against.

          Pinned, not `main`. An unpinned policy repository means a rule merged there blocks
          every pipeline in the organisation the moment it lands — which is the failure that
          gets policy-as-code switched off after one bad afternoon. Bumping this tag is a
          reviewed change in the consuming repository.
        type: string
        required: false
        default: "v1.0.0"
      terraform_version:
        type: string
        required: false
        default: "1.9.8"
      fail_on_warn:
        description: "Treat `warn` rules as blocking. Off by default — see the note below."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  policy:
    name: Policy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: infra

      - name: Checkout policies
        uses: actions/checkout@v4
        with:
          repository: Saikiran6650/devsecops-pipeline
          ref: ${{ inputs.policy_ref }}
          path: policies

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Install conftest
        run: |
          set -euo pipefail
          version=0.56.0
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${version}/conftest_${version}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin conftest
          conftest --version

      # Exceptions are resolved at evaluation time, not baked in. An expired waiver stops
      # suppressing its finding on the day it expires, without anyone needing to edit
      # anything — which is what makes the expiry real rather than aspirational.
      - name: Resolve active exceptions
        run: |
          set -euo pipefail
          python3 policies/scripts/check_exceptions.py \
            policies/policy/exceptions.yaml \
            --emit-json exceptions.json

      - name: Assume plan role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: gha-policy-${{ inputs.environment }}-${{ github.run_id }}

      - name: terraform plan
        working-directory: infra
        run: |
          set -euo pipefail
          terraform -chdir=${{ inputs.working_directory }} init -input=false -lock-timeout=5m
          terraform -chdir=${{ inputs.working_directory }} plan \
            -input=false -no-color -lock-timeout=5m -out=tfplan
          terraform -chdir=${{ inputs.working_directory }} show -json tfplan > "$GITHUB_WORKSPACE/plan.json"

      - name: Merge the plan with active exceptions
        run: |
          set -euo pipefail
          # The policies read input.resource_changes and input.exceptions from one document,
          # so the two are merged rather than passed separately.
          jq -s '.[0] * .[1]' plan.json exceptions.json > policy-input.json
          echo "resources in plan: $(jq '.resource_changes | length' policy-input.json)"
          echo "active exceptions: $(jq '.exceptions | length' policy-input.json)"

      - name: Evaluate deny rules
        id: deny
        run: |
          set -euo pipefail
          conftest test \
            --policy policies/policy/terraform \
            --namespace terraform.network,terraform.data_protection,terraform.identity \
            --output github \
            --all-namespaces=false \
            policy-input.json

      # `warn` findings are reported but do not block by default. A gate nobody can satisfy
      # teaches people to ignore red, and then they ignore it everywhere. Set fail_on_warn
      # once a repository is clean, to keep it that way.
      - name: Evaluate warn rules
        if: success() || failure()
        continue-on-error: ${{ !inputs.fail_on_warn }}
        run: |
          set -euo pipefail
          conftest test \
            --policy policies/policy/terraform \
            --namespace terraform.network,terraform.data_protection,terraform.identity \
            --output github \
            --fail-on-warn \
            policy-input.json

      - name: Summary
        if: always()
        run: |
          {
            echo "### Terraform policy — \`${{ inputs.environment }}\`"
            echo ""
            echo "- Policies: \`devsecops-pipeline@${{ inputs.policy_ref }}\`"
            echo "- Resources evaluated: \`$(jq '.resource_changes | length' policy-input.json 2>/dev/null || echo '?')\`"
            echo "- Active exceptions: \`$(jq '.exceptions | length' policy-input.json 2>/dev/null || echo '?')\`"
          } >> "$GITHUB_STEP_SUMMARY"
