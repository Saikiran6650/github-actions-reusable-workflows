name: Terraform apply

# Applies using a separate, narrower role than plan, behind a GitHub Environment.
#
# The Environment is the actual gate. Configure it with required reviewers and the job
# pauses for a human before it touches anything. Nothing in this file can bypass that —
# which is the point of putting the gate in repository settings rather than in YAML that
# the same pull request could edit.

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment to run in. Its protection rules are the promotion gate."
        type: string
        required: true
      working_directory:
        description: "Directory containing the root module to apply."
        type: string
        required: true
      aws_region:
        type: string
        required: false
        default: "us-east-1"
      role_arn:
        description: "IAM role to assume for applying. Should be scoped to the resources this stack owns, not PowerUser."
        type: string
        required: true
      terraform_version:
        type: string
        required: false
        default: "1.9.8"
      smoke_test_url_output:
        description: >-
          Name of a Terraform output holding a base URL. When set, the workflow polls
          <url>/readyz after applying. A successful apply and a working service are
          different claims; this checks the second one.
        type: string
        required: false
        default: ""
      smoke_test_path:
        type: string
        required: false
        default: "/readyz"
      smoke_test_timeout_seconds:
        type: number
        required: false
        default: 300
    outputs:
      outputs_json:
        description: "All Terraform outputs as JSON, for a caller that needs to chain."
        value: ${{ jobs.apply.outputs.outputs_json }}

permissions:
  contents: read

jobs:
  apply:
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      outputs_json: ${{ steps.outputs.outputs.json }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Assume apply role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: gha-apply-${{ inputs.environment }}-${{ github.run_id }}

      - name: terraform init
        run: terraform -chdir=${{ inputs.working_directory }} init -input=false -lock-timeout=5m

      # A lock timeout rather than the default indefinite wait. A job that blocks forever on
      # a stale lock burns runner minutes and tells nobody why.
      - name: terraform apply
        run: |
          terraform -chdir=${{ inputs.working_directory }} apply \
            -input=false -auto-approve -lock-timeout=10m

      - name: Collect outputs
        id: outputs
        run: |
          json=$(terraform -chdir=${{ inputs.working_directory }} output -json)
          {
            echo 'json<<OUTEOF'
            echo "$json"
            echo 'OUTEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: inputs.smoke_test_url_output != ''
        run: |
          set -euo pipefail
          url=$(terraform -chdir=${{ inputs.working_directory }} output -raw ${{ inputs.smoke_test_url_output }})
          target="${url}${{ inputs.smoke_test_path }}"
          deadline=$(( $(date +%s) + ${{ inputs.smoke_test_timeout_seconds }} ))

          echo "polling $target"
          until curl -fsS --max-time 5 "$target" >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$target did not become ready within ${{ inputs.smoke_test_timeout_seconds }}s"
              exit 1
            fi
            sleep 10
          done

          echo "::notice::${{ inputs.environment }} is serving at $url"
          echo "- \`${{ inputs.environment }}\` is serving at $url" >> "$GITHUB_STEP_SUMMARY"
